# Added to the compose files of hello-data-deployment/docker-compose by the e2e workflow (COMPOSE_FILE).
# minio/minio and minio/mc are no longer published on Docker Hub, so SFTPGo's S3 storage uses the bitnami builds, and the
# portal gets a second data domain.
services:
  minio:
    image: bitnamilegacy/minio:latest
    user: "0"
    entrypoint: []
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
  createbuckets:
    image: bitnamilegacy/minio-client:latest
    user: "0"
  # a second data domain for the data domain selector tests; the portal only needs it in its configuration, so it has no
  # Superset or other subsystems (and therefore no dashboards)
  hello-data-portal-api:
    environment:
      - HELLO_DATA_CONTEXTS_1=Data Domain | Extra_Data_Domain | Extra Data Domain | true
  # the dashboard access page lists the dashboard views the portal sidecar copies from Superset every 60 minutes by default
  hello-data-portal-sidecar:
    environment:
      - HELLO_DATA_SYNCHRONIZE_DASHBOARD_ACCESS_IN_MINUTES=1
