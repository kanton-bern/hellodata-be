<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8" />
    <title th:text="${layout.title()}">Custom Layout</title>
    <th:block th:replace="~{fragments/pdf :: styles}"></th:block>
</head>
<body>
    <div class="cover-page">
        <th:block th:replace="~{fragments/pdf :: header}"></th:block>
        <h1 class="title" th:text="${layout.title()}">Layout Title</h1>
    </div>

    <div class="pdf-page" th:each="page,ps : ${layout.pages()}" th:classappend="${ps.index > 0} ? 'page-break' : ''">
        <th:block th:replace="~{fragments/pdf :: gridPage(${page})}"></th:block>
    </div>
</body>
</html>
