<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8" />
    <title th:text="${export.title()}">Dashboard</title>
    <th:block th:replace="~{fragments/pdf :: styles}"></th:block>
</head>
<body>
    <th:block th:replace="~{fragments/pdf :: header}"></th:block>

    <h1 class="title" th:text="${export.title()}">Dashboard Title</h1>

    <div class="section" th:each="section : ${export.sections()}">
        <h2 class="tab-title" th:if="${!#strings.isEmpty(section.title())}"
            th:text="${section.title()}">Tab title</h2>
        <div th:each="item : ${section.items()}" th:switch="${item.type()}">
            <div th:case="'chart'" class="chart">
                <h3 class="chart-name" th:text="${item.name()}">Chart name</h3>
                <div class="chart-image">
                    <img th:src="${item.dataUri()}" alt="chart" />
                </div>
                <hr class="chart-sep" />
            </div>
            <div th:case="'markdown'" class="summary markdown" th:utext="${item.html()}">Markdown</div>
        </div>
    </div>
</body>
</html>
