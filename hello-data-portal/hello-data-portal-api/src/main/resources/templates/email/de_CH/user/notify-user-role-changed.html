<!DOCTYPE html>
<html lang="de" xmlns="http://www.w3.org/1999/html" xmlns:th="http://www.thymeleaf.org">
<head><title>Benutzerrolle geändert</title></head>
  <body>
    <p>Hallo <span th:text="${#objects.nullSafe(AFFECTED_USER_FIRST_NAME, '_Unbekannt_')}"/></p>

    <p>
      Der Administrator <span th:text="${#objects.nullSafe(FIRST_NAME_LAST_NAME_OF_USER_THAT_MADE_CHANGE, '_Unbekannt_')}"/> hat in HelloDATA in der Fachdomäne
      <span th:text="${#objects.nullSafe(BUSINESS_DOMAIN_NAME, '_Unbekannt_')}"/> Deine Rollen angepasst. Du hast folgende Rollen zugewiesen.
    </p>

    <ul>
      <li>
        Rolle Fachdomäne <span th:text="${#objects.nullSafe(BUSINESS_DOMAIN_NAME, '_Unbekannt_') + ': ' + (#objects.nullSafe(BUSINESS_DOMAIN_ROLE_NAME, 'NONE') != 'NONE' ? #objects.nullSafe(BUSINESS_DOMAIN_ROLE_NAME, '_Unbekannt_') : 'Keine Rolle')}"></span>
      </li>
    </ul>
    <div th:each="item : ${DATA_DOMAIN_ROLES}">
      <ul>
        <li>
          Rolle Datendomäne <span th:text="${item.context.name + ': ' + (item.role.name != 'NONE' ? item.role.name : 'Keine Rolle')}"></span>
        </li>
      </ul>
    </div>

    <p>Link zu Fachdomäne
      <a th:href="${#objects.nullSafe(link, '_Unbekannt_')}"><span th:text="${#objects.nullSafe(BUSINESS_DOMAIN_NAME, '_Unbekannt_')}"/></a>
    </p>

    <p>Freundliche Grüsse<br/>HelloDATA</p>

  </body>
</html>
