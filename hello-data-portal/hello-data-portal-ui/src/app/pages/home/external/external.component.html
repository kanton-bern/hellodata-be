@if ((currentUserPermissions$ | async); as permissions) {
  <div>
    @if ((externalDashboards$ | async); as externalDashboards) {
      <div>
        <p-table #dt [filterDelay]="0"
                 [globalFilterFields]="['contextName', 'url', 'title']"
                 [paginator]="true"
                 [rowHover]="true"
                 [rows]="10"
                 [rowsPerPageOptions]="[5,10, 25, 50, 100]"
                 [showCurrentPageReport]="true"
                 [tableStyle]="{ 'min-width': '20rem' }"
                 [value]="externalDashboards"
                 (onPage)="onPageChange($event)"
                 [stripedRows]="true"
                 stateStorage="session"
                 stateKey="home-external-dashboards-table"
                 dataKey="id">
          <ng-template pTemplate="caption">
            <div class="flex items-center justify-between">
              <h5 class="m-0">{{ title() }}</h5>
              <div class="flex items-center gap-2">
                <p-button
                  [label]="'@Clear' | transloco"
                  severity="secondary"
                  [icon]="icons.ACTION_FILTER_CLEAR.class"
                  (click)="clearFilter(dt)" (keydown.enter)="clearFilter(dt)"/>
                <p-iconfield>
                  <p-inputicon [ngClass]="icons.ACTION_SEARCH.class"/>
                  <input pInputText #textInput [(ngModel)]="filterValue" (input)="onFilter($event, dt)"
                         placeholder="{{'@Search' | transloco}}" type="text"/>
                </p-iconfield>
              </div>
            </div>
          </ng-template>
          <ng-template pTemplate="header">
            <tr>
              <th id="icon"></th>
              <th id="contextName" pSortableColumn="contextName" [pTooltip]="'@Data domain' | transloco"
                  tooltipPosition="top">{{ '@Data domain' | transloco }}
                <p-sortIcon field="contextName"/>
              </th>
              <th id="title" pSortableColumn="title">{{ '@Dashboard' | transloco }}
                <p-sortIcon field="title"/>
              </th>
            </tr>
          </ng-template>
          <ng-template let-dashboard pTemplate="body">
            <tr (click)="onRowNavigate(dashboard)" class="cursor-pointer" (keydown.enter)="onRowNavigate(dashboard)">
              <td>
                <div class="flex items-center justify-center gap-2">
                  <i [ngClass]="icons.ACTION_EXTERNAL_LINK.class"></i>
                </div>
              </td>
              <td [pTooltip]="dashboard.contextName" tooltipPosition="top">
                {{ dashboard.contextName }}
              </td>
              <td [pTooltip]="dashboard.title" tooltipPosition="top">
                {{ dashboard.title }}
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    }
  </div>
}
