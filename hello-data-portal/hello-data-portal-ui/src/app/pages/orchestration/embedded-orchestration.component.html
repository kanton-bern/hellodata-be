@if (currentPipelineInfo$ | async) {
  <div class="orchestration-embed">
    @if (isAirflow3) {
      <div class="af3-toolbar">
        <p-button
          styleClass="p-button-sm p-button-text"
          severity="secondary"
          [icon]="airflowSidebarHidden ? 'pi pi-angle-double-right' : 'pi pi-angle-double-left'"
          [label]="(airflowSidebarHidden ? '@Show Airflow menu' : '@Hide Airflow menu') | transloco"
          (click)="toggleAirflowSidebar()"/>
      </div>
    }
    <app-subsystem-iframe class="orchestration-frame" [delay]="600" [url]="url" [cropLeftPx]="cropLeftPx"
                          [beforeLoad]="airflow3Prepare$"
                          [reloadOnLanguageChange]="isAirflow3"/>
  </div>
}
