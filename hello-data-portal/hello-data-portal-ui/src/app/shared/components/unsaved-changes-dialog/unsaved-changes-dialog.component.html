<p-confirmDialog #cd [closable]="false" [style]="{width: '50vw'}" key="unsavedChangesConfirmation">
  <ng-template pTemplate="header">
    <div class="flex justify-between items-center w-full">
      <h4 class="m-0">{{ "@Unsaved changes title" | transloco }}</h4>
      <button (click)="cd.hide()" [pTooltip]="'@Cancel' | transloco" class="p-button-text">
        <i [ngClass]="icons.ACTION_CLOSE.class"></i>
      </button>
    </div>
  </ng-template>
  <ng-template pTemplate="footer">
    <p-button (click)="cd.onReject()" (keydown.enter)="cd.onReject()" [icon]="icons.ACTION_CANCEL.class"
              [label]="'@Discard changes' | transloco"
              pRipple severity="secondary" type="button"></p-button>
    @if (stayOnPage$ | async; as stayOnPage) {
      @if (!stayOnPage.value) {
        <p-button (click)="cd.onAccept()"
                  (keydown.enter)="cd.onAccept()"
                  pRipple
                  [icon]="icons.ACTION_SAVE.class"
                  [label]="'@Save changes' | transloco"
                  type="button"
        />
      } @else {
        <p-button (click)="cd.hide()" (keydown.enter)="cd.hide()" pRipple
                  [icon]="icons.ACTION_EDIT.class"
                  [label]="'@Continue edition' | transloco"
                  type="button"
        />
      }
    }
  </ng-template>
</p-confirmDialog>
