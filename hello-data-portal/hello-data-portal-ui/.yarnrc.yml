# Yarn 4 config. yarnPath lets the Yarn 1 bootstrap installed by frontend-maven-plugin (and any global Yarn) run the
# committed release that matches "packageManager" in package.json, so Maven installs from yarn.lock.
yarnPath: .yarn/releases/yarn-4.18.0.cjs

# Angular cannot resolve quill CSS under Plug'n'Play
nodeLinker: node-modules

enableTelemetry: false
