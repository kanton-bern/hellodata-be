# user nginx; # Not needed when running as non-root
worker_processes auto;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  include /etc/nginx/conf.d/*.conf;
  default_type application/octet-stream;

  # Don't tell nginx version to clients.
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  client_header_timeout 10m;
  client_body_timeout 10m;
  send_timeout 10m;

  connection_pool_size 256;
  client_max_body_size 5m;

  gzip on;
  gzip_disable "msie6";

  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  keepalive_timeout 75 20;

  ignore_invalid_headers on;

  # Sets a $real_scheme variable whose value is the scheme passed by the load
  # balancer in X-Forwarded-Proto (if any), defaulting to $scheme.
  # Similar to how the HttpRealIp module treats X-Forwarded-For.
  map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  # Sets a $real_port variable whose value is the port passed by the load
  # balancer in X-Forwarded-Port (if any), defaulting to $server_port.
  map $http_x_forwarded_port $real_port {
    default $http_x_forwarded_port;
    ''      $server_port;
  }

  # Cache policy for the single-page app. The JS/CSS bundles carry a content hash in their
  # filename (Angular outputHashing), so they can be cached forever - the filename changes
  # on every build. index.html and the unhashed runtime config must always be revalidated,
  # otherwise a browser/proxy can keep serving a stale index.html after a new release that
  # points at bundle hashes which no longer exist on the server -> blank screen after deploy.
  map $uri $hd_cache_control {
    default                                                      "no-cache";
    "~*/config/environment\.js$"                                 "no-cache";
    "~*\.(?:js|css|woff2?|eot|ttf|otf|svg|png|jpe?g|gif|ico)$"   "public, max-age=31536000, immutable";
  }

  # prevent clickjacking
  add_header X-Frame-Options SAMEORIGIN;

  # X-XSS-Protection
  add_header X-XSS-Protection "1; mode=block";

  # Cache-Control (see the $hd_cache_control map above). Declared here at the http level so
  # it is inherited alongside the other headers - a server/location-level add_header would
  # cancel inheritance of the CSP and X-Frame-Options headers set at this level.
  add_header Cache-Control $hd_cache_control always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  server {
    listen 127.0.0.1:8080;
    server_name 127.0.0.1;

    location = /stub_status {
      stub_status;
    }
  }

  server {
    listen *:8080;
    root /app/;
    client_max_body_size 1024m;
    index index.html index.htm;

    location = / {
      absolute_redirect off;
      rewrite ^/$ /app/ redirect;
      try_files $uri $uri/ @app;
    }

    location @app {
      rewrite ^$ /app/ redirect;
      rewrite ^/$ /app/ redirect;
      rewrite ^/app$ /index.html;
      rewrite ^/app.*$ /index.html;
      try_files $uri $uri/ /index.html;
    }

    location /app {
      alias /app/;
      try_files $uri @app;
    }
  }
}
