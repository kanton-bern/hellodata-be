name: E2E tests (docker compose)

run-name: "E2E: ${{ inputs.version || 'latest' }} (${{ inputs.browser || 'msedge' }}, Airflow ${{ inputs.airflow || '2' }})"

# Runs the Playwright regression suite against the portal and the default data domain's Superset of the docker compose
# installation.
# Called from maven.yml for release candidate tags (after the images are pushed), runs every working night against
# 'latest', and can be started manually on any branch for any published image tag. maven.yml publishes images for every push: develop as 'latest', and gitflow
# branches as '<name after the prefix>-SNAPSHOT' (e.g. feature/my-change -> my-change-SNAPSHOT).
on:
  workflow_call:
    inputs:
      version:
        description: 'Docker image tag of the HelloDATA images to test'
        required: true
        type: string
      browser:
        description: 'Browser to run the tests in: chromium (bundled with Playwright) or msedge (Microsoft Edge)'
        required: false
        default: 'msedge'
        type: string
      airflow:
        description: 'Airflows to test: 2 (the Airflow of the compose installation), 3 (compose-airflow3.yaml of the e2e suite) or 2,3 (both in one run)'
        required: false
        default: '2,3'
        type: string
  # every working night against the images of develop ('latest'), so the reports are fresh in the morning; schedules
  # run only from the default branch and have no inputs, so the version and browser fall back to latest and msedge
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image tag of the HelloDATA images to test (e.g. 1.7.0.rc1, latest or my-change-SNAPSHOT for feature/my-change)'
        required: true
        default: 'latest'
        type: string
      browser:
        description: 'Browser to run the tests in'
        required: true
        default: 'msedge'
        type: choice
        options:
          - msedge
          - chromium
      airflow:
        description: 'Airflows to test (3 needs the airflow3-<version> images, published since 1.7.0)'
        required: true
        default: '2,3'
        type: choice
        options:
          - '2,3'
          - '2'
          - '3'

concurrency:
  group: e2e-${{ inputs.version || 'latest' }}-${{ inputs.browser || 'msedge' }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # the batch import tests wait for the scan of the batch folder for every csv file, the data eng. tests for the
    # Airflow and SFTPGo sidecars
    timeout-minutes: 100
    permissions:
      contents: read

    env:
      HD_VERSION: ${{ inputs.version || 'latest' }}
      # the dashboard tests wait for changes made in Superset to reach the portal
      HD_SUPERSET_PUBLISH_INTERVAL_MINUTES: 1
      # the dbt docs sidecar publishes every 10 minutes by default, and the stack is only ready once it did
      HD_DBT_DOCS_PUBLISH_INTERVAL_MINUTES: 1
      # every batch import test waits for the next scan of the batch folder (30 seconds by default)
      HD_BATCH_USERS_SCAN_INTERVAL_SECONDS: 5
      # the pipeline status tests add DAG files and wait for Airflow to parse them and for its sidecar to publish them
      HD_AIRFLOW_DAG_DIR_LIST_INTERVAL_SECONDS: 30
      HD_AIRFLOW_PUBLISH_INTERVAL_MINUTES: 1
      # the Filebrowser menu entry appears once the SFTPGo sidecar published its app info
      HD_SFTPGO_PUBLISH_INTERVAL_MINUTES: 1
      # the Airflows to start and test, one Playwright project each (playwright.config.ts): the first runs the whole
      # suite, the others only the Airflow specs; Airflow 3 comes from compose-airflow3.yaml. The nightly schedule has
      # no inputs and tests Airflow 2 (develop had no Airflow 3 images before 1.7.0)
      E2E_AIRFLOW_VERSIONS: ${{ inputs.airflow || '2' }}
      # the services the tests use, the others they depend on are started with them; the step "Add e2e compose
      # override" adds the Airflow services and writes the list to E2E_SERVICES
      E2E_BASE_SERVICES: >-
        hello-data-portal-ui hello-data-superset-sidecar-default-data-domain hello-data-sftpgo-sidecar
      # msedge for Microsoft Edge (the default, also for the nightly schedule without inputs), empty for the Chromium bundled with Playwright
      E2E_BROWSER_CHANNEL: ${{ inputs.browser != 'chromium' && 'msedge' || '' }}
      COMPOSE_PROJECT_NAME: hellodata-e2e
      COMPOSE_DIR: hello-data-deployment/docker-compose
      E2E_DIR: hello-data-portal/hello-data-portal-ui-e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # first, so the results can be summarized also when the stack did not start
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.E2E_DIR }}/package-lock.json

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

      # the compose files are listed in COMPOSE_FILE of the compose .env, the e2e override replaces unavailable images;
      # for Airflow 3 compose-airflow3.yaml adds its services. E2E_AIRFLOW_MODULES are the module types of the DAGs the
      # step "Wait for sidecar resources" waits for
      - name: Add e2e compose override
        working-directory: ${{ env.COMPOSE_DIR }}
        run: |
          files="$(grep '^COMPOSE_FILE=' .env | cut -d= -f2):$GITHUB_WORKSPACE/$E2E_DIR/compose-override.yaml"
          services="$E2E_BASE_SERVICES"
          modules=""
          for version in ${E2E_AIRFLOW_VERSIONS//,/ }; do
            case "$version" in
              2) services="$services airflow-webserver airflow-scheduler hello-data-airflow-sidecar"
                 modules="$modules,'AIRFLOW'" ;;
              3) files="$files:$GITHUB_WORKSPACE/$E2E_DIR/compose-airflow3.yaml"
                 services="$services airflow3-api-server airflow3-scheduler airflow3-dag-processor airflow3-sync-perm hello-data-airflow3-sidecar"
                 modules="$modules,'AIRFLOW3'" ;;
              *) echo "unknown Airflow version $version in '$E2E_AIRFLOW_VERSIONS'"; exit 1 ;;
            esac
          done
          echo "COMPOSE_FILE=$files" >> "$GITHUB_ENV"
          echo "E2E_SERVICES=$services" >> "$GITHUB_ENV"
          echo "E2E_AIRFLOW_MODULES=${modules#,}" >> "$GITHUB_ENV"

      - name: Pull images
        working-directory: ${{ env.COMPOSE_DIR }}
        run: docker compose pull --quiet --include-deps $E2E_SERVICES

      # a tag like latest or *-SNAPSHOT moves, the digests say which images were really tested (shown in the report)
      - name: Record image digests
        working-directory: ${{ env.COMPOSE_DIR }}
        run: |
          docker compose config --images | sort -u | while read -r image; do
            digest=$(docker image inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "$image" 2>/dev/null || true)
            jq -n --arg image "$image" --arg digest "$digest" '{image: $image, digest: $digest}'
          done | jq -s . > "$GITHUB_WORKSPACE/images.json"

      - name: Start portal, Superset, Airflow and SFTPGo services
        working-directory: ${{ env.COMPOSE_DIR }}
        run: docker compose up -d --wait --wait-timeout 900 $E2E_SERVICES

      # sidecars publish their resources on an interval (1 minute for dbt docs, Superset, Airflow and SFTPGo here), and
      # on a fresh install the first round can be published before the portal sidecar subscribed - so wait until the
      # portal knows the dbt docs instance, the Superset dashboards, the DAGs of every Airflow under test (module AIRFLOW
      # and/or AIRFLOW3) and the SFTPGo instance
      - name: Wait for sidecar resources
        working-directory: ${{ env.COMPOSE_DIR }}
        run: |
          query="select count(distinct module_type) from resource
                 where (kind = 'hellodata/AppInfo' and module_type in ('DBT_DOCS', 'SFTPGO'))
                    or (kind = 'hellodata/Dashboards' and module_type = 'SUPERSET')
                    or (kind = 'hellodata/Pipelines' and module_type in ($E2E_AIRFLOW_MODULES))"
          # dbt docs, SFTPGo and Superset, plus one per Airflow
          expected=$((3 + $(tr ',' '\n' <<< "$E2E_AIRFLOW_MODULES" | wc -l)))
          for i in $(seq 1 75); do
            count=$(docker compose exec -T postgres psql -U postgres -d hd_metainfo -tAc "$query")
            if [ "${count:-0}" -ge "$expected" ]; then
              echo "dbt docs, Superset, Airflow and SFTPGo resources available after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "dbt docs, Superset, Airflow or SFTPGo resources were not published within 12.5 minutes"
          exit 1

      # The CloudBeaver sidecar creates the roles and teams of a data domain (e.g. EXTRA_DATA_DOMAIN_READ_DWH) when a
      # subsystem sidecar publishes its app info for that data domain. The Extra Data Domain of the e2e override has no
      # subsystem, so the step publishes a copy of the dbt docs app info for it, as a sidecar of that data domain would:
      # the CloudBeaver sidecar then creates its teams and the SFTPGo sidecar its groups. The copy keeps the url of the
      # dbt docs, so the portal's lineage page works the same whichever of the two it uses. The stored app info has no
      # type of its sub context, which the sidecars need to see that it is a data domain.
      - name: Publish the Extra Data Domain to the sidecars
        working-directory: ${{ env.COMPOSE_DIR }}
        run: |
          appinfo=$(docker compose exec -T postgres psql -U postgres -d hd_metainfo -tAc \
            "select metainfo from resource where kind = 'hellodata/AppInfo' and module_type = 'DBT_DOCS' limit 1")
          message=$(jq -c '.instanceName += "-extra-data-domain"
            | .businessContextInfo.subContext += {type: "Data Domain", key: "Extra_Data_Domain", name: "Extra Data Domain", extra: true}' <<< "$appinfo")
          echo "$message"
          docker compose run --rm -T --entrypoint nats nats-box --server nats:4222 pub publish_resources.app_info "$message"

      # The portal sidecar assigns the portal roles (the permissions) of a user when the portal api publishes its context
      # roles. The api publishes the example users at startup, often before the portal sidecar is subscribed, so the
      # step asks the api for a new synchronization of all users (like the "Synchronize users" button) and waits for it.
      - name: Wait for the portal roles of the example users
        working-directory: ${{ env.COMPOSE_DIR }}
        run: |
          psql() { docker compose exec -T postgres psql -U postgres -d hd_metainfo -tAc "$1"; }
          query="select count(*) from user_ u
                 where not exists (select 1 from user_portal_role p where p.user_id = u.id)
                   and exists (select 1 from user_context_role c join role r on r.id = c.role_id
                               where c.user_id = u.id and r.name <> 'NONE')"
          if [ "$(psql "$query")" -eq 0 ]; then
            echo "all users have their portal roles"
            exit 0
          fi
          psql "update user_sync_lock set status = 'STARTED', modified_date = now()" > /dev/null
          for i in $(seq 1 30); do
            sleep 10
            missing=$(psql "$query")
            if [ "${missing:-1}" -eq 0 ]; then
              echo "all users have their portal roles after $((i * 10))s"
              exit 0
            fi
          done
          echo "$missing users still have no portal roles after 5 minutes"
          exit 1

      # The CloudBeaver sidecar creates the teams of a data domain (e.g. DEFAULT_DATA_DOMAIN_READ_DWH) when a sidecar
      # publishes the data domain. The gateway logs the user in with these teams, and CloudBeaver refuses the login of
      # a user whose team is missing. The step does not fail the job, it prints what CloudBeaver has for the DWH tests.
      - name: Wait for the CloudBeaver teams of the data domains
        working-directory: ${{ env.COMPOSE_DIR }}
        run: |
          psql() { docker compose exec -T postgres psql -U postgres -d hd_cloudbeaver -tAc "$1"; }
          teams="select count(*) from cb_team where team_id in ('DEFAULT_DATA_DOMAIN_READ_DWH', 'EXTRA_DATA_DOMAIN_READ_DWH')"
          for i in $(seq 1 18); do
            if [ "$(psql "$teams")" = "2" ]; then
              echo "CloudBeaver teams available after $(((i - 1) * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::CloudBeaver has not the READ_DWH teams of both data domains after 3 minutes"
          psql "select team_id from cb_team"
          psql "select u.email, string_agg(r.key, ',') from hd_user u left join hd_users_roles ur on ur.hd_user_id = u.id
                left join hd_role r on r.id = ur.hd_role_id group by u.email"

      - name: Install dependencies
        working-directory: ${{ env.E2E_DIR }}
        run: |
          npm ci
          npx playwright install --with-deps ${{ inputs.browser != 'chromium' && 'msedge' || 'chromium' }}

      - name: Run Playwright tests
        working-directory: ${{ env.E2E_DIR }}
        run: npx playwright test

      # summary.json (what was tested and its result) for the published report, and the same as the job summary; also
      # when the stack did not start, then with the status 'error'
      - name: Summarize test results
        if: ${{ !cancelled() }}
        working-directory: ${{ env.E2E_DIR }}
        env:
          E2E_BROWSER: ${{ inputs.browser || 'msedge' }}
        run: >-
          node scripts/summarize.mjs --results test-results/results.json
          --images "$GITHUB_WORKSPACE/images.json" --out "$GITHUB_WORKSPACE/summary.json"

      - name: Collect compose logs
        if: ${{ !cancelled() }}
        working-directory: ${{ env.COMPOSE_DIR }}
        run: |
          docker compose ps -a
          docker compose logs --no-color > "${{ github.workspace }}/compose.log" 2>&1

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: e2e-report-${{ inputs.version || 'latest' }}-${{ inputs.browser || 'msedge' }}
          path: |
            ${{ env.E2E_DIR }}/playwright-report/
            ${{ env.E2E_DIR }}/test-results/
            compose.log
            summary.json
          retention-days: 14

      - name: Stop services
        if: ${{ always() }}
        working-directory: ${{ env.COMPOSE_DIR }}
        run: docker compose down --volumes --remove-orphans

  # Publishes the report to the e2e/ folder of the gh-pages branch, which GitHub Pages serve next to the docs:
  # https://kanton-bern.github.io/hellodata-be/e2e/ lists all versions, e2e/<version>/ shows the runs of a version and
  # what its latest run tested, and e2e/<version>/<browser>/<run id>-<attempt>/ each run. deploy_docs.yml replaces the rest of gh-pages and keeps e2e/.
  publish:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      E2E_DIR: hello-data-portal/hello-data-portal-ui-e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download test report
        uses: actions/download-artifact@v5
        with:
          name: e2e-report-${{ inputs.version || 'latest' }}-${{ inputs.browser || 'msedge' }}
          path: ${{ runner.temp }}/artifact

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Publish report
        env:
          ARTIFACT: ${{ runner.temp }}/artifact
        run: |
          message=$(jq -r '"E2E \(.version) (\(.browser), Airflow \(.airflow // "2" | split(",") | join(" + "))): \(.status) - run \(.runId)"' "$ARTIFACT/summary.json")
          .github/scripts/update-gh-pages.sh "$message" bash -c \
            'node "$0" --site e2e --summary "$1" --report "$2" && touch .nojekyll' \
            "$GITHUB_WORKSPACE/$E2E_DIR/scripts/build-reports-site.mjs" "$ARTIFACT/summary.json" \
            "$ARTIFACT/$E2E_DIR/playwright-report"

      - name: Link the report
        id: link
        env:
          ARTIFACT: ${{ runner.temp }}/artifact
        run: |
          read -r version run < <(jq -r '[.version, "\(.browser)\(if (.airflow // "2" | split(",") | index("2")) then "" else "-airflow3" end)/\(.runId)-\(.runAttempt)"] | map(gsub("[^A-Za-z0-9._/-]"; "_")) | join(" ")' "$ARTIFACT/summary.json")
          owner="${GITHUB_REPOSITORY%%/*}"
          base="https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}/e2e/$version"
          echo "Report of $version: $base/ (this run: $base/$run/)"
          echo "### Published report: [$version]($base/) ([this run]($base/$run/))" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$base/$run/" >> "$GITHUB_OUTPUT"

      - name: Notify Microsoft Teams
        if: ${{ always() && env.TEAMS_WEBHOOK_URL != '' }}
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ARTIFACT: ${{ runner.temp }}/artifact
          REPORT_URL: ${{ steps.link.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq --arg report "$REPORT_URL" --arg run "$RUN_URL" '
            ({passed: "✅", failed: "❌", error: "⚠️"}[.status] // "❔") as $icon
            | {
                type: "message",
                attachments: [{
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      { type: "TextBlock", size: "Large", weight: "Bolder", wrap: true,
                        color: (if .status == "passed" then "Good" else "Attention" end),
                        text: "\($icon) E2E \(.version) (\(.browser), Airflow \(.airflow // "2" | split(",") | join(" + "))): \(.status)" },
                      { type: "FactSet", facts: [
                        { title: "Total",   value: "\(.stats.total)" },
                        { title: "Passed",  value: "\(.stats.passed)" },
                        { title: "Failed",  value: "\(.stats.failed)" },
                        { title: "Flaky",   value: "\(.stats.flaky)" },
                        { title: "Skipped", value: "\(.stats.skipped)" } ] }
                    ],
                    actions: [
                      { type: "Action.OpenUrl", title: "Open report", url: $report },
                      { type: "Action.OpenUrl", title: "Open run",    url: $run } ]
                  }
                }]
              }' "$ARTIFACT/summary.json" > card.json
          curl --fail-with-body -sS -H "Content-Type: application/json" \
            -d @card.json "$TEAMS_WEBHOOK_URL"
