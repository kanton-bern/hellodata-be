hello-data:
  #    code: 'type | key | name'
  business-context: 'Business Domain | HelloDATA_Product_Development | HelloDATA Product Development'
  airflow:
    host: localhost
    port: 28080
    # Airflow 3 REST API v2 auth: mint an HS512 JWT signed with the api-server's
    # AIRFLOW__API_AUTH__JWT_SECRET (aud=apache-airflow). api-user-id is the `sub`
    # (FAB user id of a service/admin user with DAG read). Set both on k8s.
    jwt-secret: "${AIRFLOW_API_JWT_SECRET}"
    api-user-id: "${AIRFLOW_API_USER_ID}"
    jwt-ttl-seconds: 300
  instance:
    # enforce to be set on k8s externally
    url: "${HELLODATA_INSTANCE_URL}"
    # enforce to be set on k8s externally
    name: "Airflow 3"
  sidecar:
    publish-interval-minutes: 10

spring:
  application:
    name: HelloDATA Sidecar for Airflow 3
  cloud:
    kubernetes:
      discovery:
        enabled: false
  security:
    user:
      name: "user"
      password: "password"

nats:
  spring:
    server: nats://0.0.0.0:4222

server:
  port: 8085

# Actuator endpoints. List available under http://localhost:8081/api/actuator
management:
  endpoint:
    health:
      show-details: always
      access: read_only
    info:
      access: read_only
    prometheus:
      access: read_only
  endpoints:
    web:
      exposure:
        include: [ '*' ]
  health:
    mail:
      enabled: false
    ldap:
      enabled: false # Disable this when not using ldap connection
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        spring.data.repository.invocations: true
        http.server.requests: true
        http.client.requests: true
